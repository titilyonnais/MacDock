# Publication (plan 52) : une étiquette vX.Y.Z (ou vX.Y.Z-rc.N, préversion) envoyée sur GitHub construit
# l'installateur et le joint à une release, avec son empreinte SHA-256 (SHA256SUMS.txt), que les mises à jour de
# MacDock vérifient. L'étiquette doit correspondre exactement à src/core/version_defs.h et viser un commit de main.
# Seul le jeton fourni par GitHub sert, et seulement à l'étape de publication ; l'étiquette passe par une variable
# d'environnement, jamais recopiée dans un script ; action épinglée par empreinte de commit.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Étiquette sur main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "L'étiquette $env:TAG ne vise pas un commit de main." }

      - name: Inno Setup 6.7.3
        shell: pwsh
        # Version figée, celle des essais (Inno Setup 7 est sorti depuis, non essayé), téléchargée chez son auteur et
        # vérifiée (empreinte publiée par winget pour JRSoftware.InnoSetup 6.7.3).
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $sha = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest -Uri $url -OutFile innosetup.exe
          if ((Get-FileHash -Algorithm SHA256 innosetup.exe).Hash.ToLowerInvariant() -ne $sha) { throw 'Empreinte inattendue' }
          Start-Process -FilePath ./innosetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) { throw 'ISCC.exe introuvable' }

      - name: Installateur
        shell: pwsh
        run: ./tools/make-installer.ps1 -Tag $env:TAG -BinDir build/Release

      - name: Publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Relancée après un échec partiel : la release existante reçoit les fichiers (remplacés).
        run: |
          $version = $env:TAG.Substring(1)
          $files = @("build/installer/MacDock-Setup-$version.exe", 'build/installer/SHA256SUMS.txt')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $notes = "docs/releases/$version.md"
            $publish = @($env:TAG) + $files + @('--title', "MacDock $version")
            $publish += if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
            if ($version.Contains('-')) { $publish += '--prerelease' }
            gh release create @publish
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publication impossible' }
